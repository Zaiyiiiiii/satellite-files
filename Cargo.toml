[package]
name = "satellite-files"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "A clean, modern file server running as a WASIp3 HTTP component"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasip3 = { version = "0.9.0", features = ["async-spawn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
